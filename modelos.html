<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Convites | Convites Premium</title>
    <meta name="description"
        content="Galeria de modelos de convites digitais premium. Escolha seu modelo favorito para aniversários, casamentos, 15 anos e muito mais.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0a0a0a',
                        darker: '#050505',
                        primary: '#ffffff',
                        accent: '#c9557c',
                        'accent-light': '#e8a0b8',
                        glass: 'rgba(255, 255, 255, 0.05)',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Model source configuration (GitHub vs Supabase) -->
    <script src="js/model_sources.js"></script>

    <style>
        /* Theme Variables */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f4f6;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(0, 0, 0, 0.03);
            --glass-border: rgba(0, 0, 0, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .gradient-text {
            background: linear-gradient(135deg, #c9557c, #e8a0b8, #c9557c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Theme Toggle */
        .theme-toggle {
            width: 56px;
            height: 28px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .theme-toggle .toggle-knob {
            width: 22px;
            height: 22px;
            background: var(--bg-primary);
            border-radius: 50%;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .theme-toggle .toggle-knob svg {
            width: 14px;
            height: 14px;
            color: #f59e0b;
        }

        [data-theme="dark"] .theme-toggle .toggle-knob {
            transform: translateX(28px);
        }

        [data-theme="dark"] .theme-toggle .toggle-knob svg {
            color: #a78bfa;
        }

        /* Model Card */
        .model-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .model-card:hover {
            border-color: rgba(201, 85, 124, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px var(--shadow-color);
        }

        .model-card.selected {
            border-color: #c9557c;
            box-shadow: 0 0 30px rgba(201, 85, 124, 0.4);
        }

        .model-card.selected::before {
            content: '\2713';
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #c9557c, #a84466);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 10;
        }

        .model-media-pair {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            padding: 8px;
            background: var(--bg-secondary);
        }

        .model-media-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            overflow: hidden;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-media-label {
            position: absolute;
            left: 6px;
            bottom: 6px;
            z-index: 2;
            padding: 2px 6px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.58);
            color: #fff;
            font-size: 9px;
            font-weight: 600;
            line-height: 1.2;
        }

        .model-cover {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.4s ease, opacity 0.4s ease;
            opacity: 0;
        }

        .model-cover.loaded {
            opacity: 1;
        }

        .model-card:hover .model-cover.loaded {
            transform: scale(1.02);
        }

        /* Skeleton loading */
        .cover-skeleton {
            width: 100%;
            aspect-ratio: 9/16;
            background: linear-gradient(110deg, var(--bg-secondary) 8%, rgba(255,255,255,0.15) 18%, var(--bg-secondary) 33%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s ease-in-out infinite;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .card-info-skeleton .skel-line {
            height: 12px;
            background: linear-gradient(110deg, var(--bg-secondary) 8%, rgba(255,255,255,0.1) 18%, var(--bg-secondary) 33%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 0.75rem;
        }

        /* Loading overlay */
        #loadingOverlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 0;
            gap: 1rem;
        }

        #loadingOverlay .loading-text {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Model gallery */
        .models-gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            align-items: start;
            padding: 0.5rem 0;
        }

        @media (min-width: 640px) {
            .models-gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            }
        }

        @media (min-width: 1024px) {
            .models-gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            }
        }

        /* Notice Bar */
        .notice-bar {
            background: linear-gradient(135deg, rgba(201, 85, 124, 0.1), rgba(201, 85, 124, 0.05));
            border: 1px solid rgba(201, 85, 124, 0.2);
        }

        /* Search */
        .search-input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: rgba(201, 85, 124, 0.5);
            outline: none;
            box-shadow: 0 0 20px rgba(201, 85, 124, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .suggestion-btn {
            background: rgba(201, 85, 124, 0.1);
            border: 1px solid rgba(201, 85, 124, 0.3);
            color: #c9557c;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .suggestion-btn:hover {
            background: rgba(201, 85, 124, 0.2);
            border-color: rgba(201, 85, 124, 0.5);
        }

        .suggestion-btn.active {
            background: #c9557c;
            color: white;
            border-color: #c9557c;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #c9557c, #a84466);
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 4px 20px rgba(201, 85, 124, 0.4);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: rgba(201, 85, 124, 0.3);
        }

        /* Bottom Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(201, 85, 124, 0.3);
            padding: 1rem;
            z-index: 100;
        }

        [data-theme="dark"] .bottom-bar {
            background: rgba(10, 10, 10, 0.95);
        }

        .btn-orcamento {
            background: linear-gradient(135deg, #c9557c, #a84466);
            color: white;
            font-weight: 600;
            padding: 0.875rem 2rem;
            border-radius: 9999px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(201, 85, 124, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-orcamento:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201, 85, 124, 0.5);
        }

        /* Section Title */
        .section-title {
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        /* Preview Modal */
        .preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-modal-header {
            background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            gap: 0.5rem;
        }

        .preview-modal-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow: hidden;
        }

        .preview-iframe-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .device-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .device-btn.active {
            background: #c9557c;
            color: white;
        }

        .device-btn:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
        }

        .device-btn:not(.active):hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Loading spinner */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #c9557c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script src="js/meta-pixel.js"></script>
</head>

    <script>
        // ============================
        // Sanitize slug for Storage paths (remove accents)
        function sanitizeSlug(slug) {
            return slug.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9\-_]/g, '-');
        }

        function normalizeText(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        }

        function uniqueValues(values) {
            return [...new Set(values.filter(Boolean))];
        }

        function isDebutanteType(tipo) {
            const normalized = normalizeText(tipo).replace(/\s+/g, ' ');
            return normalized === 'debutante' || normalized === '15 anos' || normalized === 'quinze anos';
        }

        function isEventType(model, tipo) {
            if (isDebutanteType(tipo)) return isDebutanteType(model.tipo);
            return normalizeText(model.tipo) === normalizeText(tipo);
        }

        function getAssetType(assetPath) {
            return /\.(mp4|webm|mov)$/i.test(assetPath || '') ? 'video' : 'image';
        }

        function getModelAssetUrl(slug, assetPath) {
            if (!assetPath) return '';
            if (/^(data:|blob:|https?:\/\/)/i.test(assetPath)) return assetPath;
            const cleanPath = String(assetPath).replace(/^\.?\//, '').replace(/^assets\//, '');
            return getAssetBaseUrl(slug) + cleanPath;
        }

        function getFilledSheetPath(modelData) {
            const assets = modelData.config_json?.assets || {};
            return modelData.folha_preenchida_path
                || modelData.folhaPreenchida_path
                || modelData.folha_path
                || assets.folhaPreenchida
                || assets.folha_preenchida
                || assets.folha
                || '';
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================
        // THEME
        // ============================
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.innerHTML = '<path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>';
            } else {
                icon.innerHTML = '<path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>';
            }
        }

        // Initialize theme
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        })();

        // ============================
        // PREVIEW MODAL
        // ============================
        let currentPreviewModel = null;

        async function openPreview(model) {
            currentPreviewModel = model;
            document.getElementById('previewTitle').textContent = model.name;
            const frame = document.getElementById('previewFrame');
            const siteRoot = new URL('.', window.location.href).href;
            const url = siteRoot + 'modelos/' + encodeURIComponent(model.slug) + '/index.html';
            try {
                const r = await fetch(url);
                let html = await r.text();
                
                const slug = sanitizeSlug(model.slug);
                const MODEL_BASE = siteRoot + 'modelos/' + encodeURIComponent(model.slug) + '/';
                const ASSET_BASE = MODEL_BASE + 'assets/';
                
                // Inject <base> tag so ALL relative URLs resolve correctly in srcdoc
                html = html.replace('<head>', '<head><base href="' + MODEL_BASE + '">');
                
                // Also do static replacement as belt-and-suspenders
                html = html.replace(/(["'])assets\//g, '$1' + ASSET_BASE);
                html = html.replace(/(url\()assets\//g, '$1' + ASSET_BASE);
                
                const assetFix = '<script>' +
                  "window.__SUPABASE_ASSETS='';" +
                  "window.assetUrl=function(p){return '" + ASSET_BASE + "'+(p||'').replace(/^assets\\//,'')};" +
                  "(function(){" +
                  "var AB='" + ASSET_BASE + "';" +
                  "function fix(v){return v&&typeof v==='string'&&v.indexOf('assets/')===0?AB+v.substring(7):v;}" +
                  // Patch setAttribute
                  "var _sa=Element.prototype.setAttribute;" +
                  "Element.prototype.setAttribute=function(n,v){if(n==='src'||n==='data-src'||n==='poster')v=fix(v);return _sa.call(this,n,v);};" +
                  // Patch .src property setter for img, video, source, audio
                  "function patchSrc(Cls){var d=Object.getOwnPropertyDescriptor(Cls.prototype,'src');if(!d||!d.set)return;var _s=d.set;Object.defineProperty(Cls.prototype,'src',{set:function(v){_s.call(this,fix(v));},get:d.get,configurable:true});}" +
                  "patchSrc(HTMLImageElement);patchSrc(HTMLVideoElement);patchSrc(HTMLSourceElement);patchSrc(HTMLAudioElement);" +
                  // Patch __loadConfig to use inline config and rewrite config asset paths
                  "window.__loadConfig=async function(){" +
                  "if(window.__INLINE_CONFIG)window.config=window.__INLINE_CONFIG;" +
                  "if(window.config){" +
                  "['assets','imagens','backgrounds'].forEach(function(k){" +
                  "if(window.config[k]&&typeof window.config[k]==='object'){" +
                  "for(var p in window.config[k]){" +
                  "var v=window.config[k][p];" +
                  "if(typeof v==='string')window.config[k][p]=fix(v);" +
                  "else if(Array.isArray(v))window.config[k][p]=v.map(function(x){return typeof x==='string'?fix(x):x;});" +
                  "}}});" +
                  "if(window.config.musica)window.config.musica=fix(window.config.musica);" +
                  "}" +
                  "};" +
                  "})();" +
                  '<\/script>';
                html = html.replace('</head>', assetFix + '</head>');
                // Inject __loadConfig() call before init()
                html = html.replace('init();', 'window.__loadConfig?window.__loadConfig().then(init).catch(init):init();');
                frame.srcdoc = html;
            } catch (e) {
                console.error('Error loading preview:', e);
                frame.srcdoc = '<p style="padding:2rem;text-align:center;">Erro ao carregar prévia.</p>';
            }
            document.getElementById('previewModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            // Always mobile view
            const container = document.getElementById('previewContainer');
            container.style.width = '390px';
            container.style.height = '844px';
            container.style.maxHeight = '85vh';
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
            const frame = document.getElementById('previewFrame');
            frame.srcdoc = '';
            document.body.style.overflow = '';
            currentPreviewModel = null;
        }

        function toggleDevice(device) {
            const container = document.getElementById('previewContainer');
            const btnMobile = document.getElementById('btnMobile');
            const btnDesktop = document.getElementById('btnDesktop');

            if (device === 'mobile') {
                container.style.width = '390px';
                container.style.height = '844px';
                container.style.maxHeight = '85vh';
                btnMobile.classList.add('active');
                btnDesktop.classList.remove('active');
            } else {
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.maxHeight = '85vh';
                btnMobile.classList.remove('active');
                btnDesktop.classList.add('active');
            }
        }

        function chooseFromPreview() {
            if (currentPreviewModel) {
                selectModel(currentPreviewModel.slug);
            }
        }

        function copyModelLink() {
            if (currentPreviewModel) {
                const url = new URL(window.location.href);
                url.searchParams.set('modelo', currentPreviewModel.slug);
                navigator.clipboard.writeText(url.href).then(() => {
                    const btn = document.getElementById('copyLinkBtn');
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> <span class="hidden sm:inline">Copiado!</span>';
                    btn.classList.replace('bg-gray-700/80', 'bg-green-600');
                    btn.classList.replace('hover:bg-gray-600', 'hover:bg-green-700');
                    btn.classList.replace('border-gray-600', 'border-green-600');
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.classList.replace('bg-green-600', 'bg-gray-700/80');
                        btn.classList.replace('hover:bg-green-700', 'hover:bg-gray-600');
                        btn.classList.replace('border-green-600', 'border-gray-600');
                    }, 2000);
                }).catch(err => {
                    console.error('Failed to copy', err);
                    alert('Erro ao copiar link. Copie manualmente: ' + url.href);
                });
            }
        }

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePreview();
        });

        // ============================
        // MODEL DATA
        // ============================
        let slugs = [];
        let models = [];
        let selectedModelSlug = null;
        let coverObserver = null;
        const PREFETCH_AHEAD_CARDS = 2;
        let lastModelosJson = '';

        // Load models from local modelos.json
        async function discoverSlugs() {
            try {
                const r = await fetch('modelos.json');
                const data = await r.json();
                const newJson = JSON.stringify(data);
                if (newJson !== lastModelosJson) {
                    lastModelosJson = newJson;
                    // Preencher models diretamente com dados do JSON
                    models = data.map(m => ({
                        slug: m.slug,
                        name: m.name || formatSlug(m.slug),
                        tipo: m.tipo,
                        tema: m.tema,
                        paletaCores: m.paleta_cores,
                        buttonColor: m.button_color || '#c9557c',
                        tags: buildTags(m.tipo),
                        coverPath: m.capa_path || '',
                        coverType: m.capa_type || (/\.(mp4|webm|mov)$/i.test(m.capa_path || '') ? 'video' : 'image'),
                        cover: getCoverUrl(m.slug, m.capa_path),
                        sheetPath: getFilledSheetPath(m),
                        sheetType: getAssetType(getFilledSheetPath(m)),
                        sheet: getModelAssetUrl(m.slug, getFilledSheetPath(m)),
                        loaded: true
                    }));
                    slugs = models.map(m => m.slug);
                    return true;
                }
                return false;
            } catch (e) {
                console.error('Error loading models from modelos.json:', e);
                return false;
            }
        }

        function buildTags(tipo) {
            const tags = [];
            if (tipo) tags.push(tipo);
            if (isDebutanteType(tipo)) tags.push('Debutante', '15 Anos');
            if (normalizeText(tipo) === 'formatura') tags.push('Adulto');
            if (normalizeText(tipo) === 'casamento') tags.push('Adulto');
            return uniqueValues(tags);
        }

        function formatSlug(slug) {
            return slug
                .replace(/^(modelo-|Modelo-)/, '')
                .replace(/-/g, ' ')
                .replace(/([A-Z])/g, ' $1')
                .trim();
        }

        function getRenderedCards() {
            return Array.from(document.querySelectorAll('.model-card'));
        }

        function loadMediaElement(media) {
            if (!media || media.dataset.loaded === 'true') return;
            const src = media.dataset.src;
            if (!src) return;

            media.dataset.loaded = 'true';
            media.removeAttribute('data-src');

            if (media.tagName === 'VIDEO') {
                media.addEventListener('loadedmetadata', () => media.classList.add('loaded'), { once: true });
                media.addEventListener('canplay', () => media.classList.add('loaded'), { once: true });
                media.src = src;
                media.load();
                return;
            }

            media.addEventListener('load', () => media.classList.add('loaded'), { once: true });
            media.addEventListener('error', () => {
                const fallback = media.dataset.fallback;
                if (fallback && media.src !== fallback) {
                    media.src = fallback;
                }
                media.classList.add('loaded');
            }, { once: true });
            media.src = src;
        }

        function loadCardMedia(card) {
            if (!card || card.dataset.mediaLoaded === 'true') return;
            card.dataset.mediaLoaded = 'true';
            card.querySelectorAll('.model-cover').forEach(loadMediaElement);
        }

        function preloadCardAndNext(card) {
            const cards = getRenderedCards();
            const start = cards.indexOf(card);
            if (start < 0) return;
            for (let i = start; i <= start + PREFETCH_AHEAD_CARDS && i < cards.length; i++) {
                loadCardMedia(cards[i]);
            }
        }

        function primeVisibleCards() {
            const cards = getRenderedCards();
            const visibleCards = cards.filter(card => {
                const rect = card.getBoundingClientRect();
                return rect.bottom >= 0 && rect.top <= window.innerHeight;
            });
            (visibleCards.length ? visibleCards : cards.slice(0, 1)).forEach(preloadCardAndNext);
        }

        function observeRenderedCards() {
            if (!coverObserver) return;
            coverObserver.disconnect();
            getRenderedCards().forEach(card => coverObserver.observe(card));
            requestAnimationFrame(primeVisibleCards);
        }

        // Initialize Intersection Observer for dynamic media loading
        function initCoverObserver() {
            coverObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        preloadCardAndNext(entry.target);
                        coverObserver.unobserve(entry.target);
                    }
                });
            }, {
                rootMargin: '0px',
                threshold: 0.01
            });
        }

        async function loadModels(showLoading = true) {
            // Check selected model first
            const saved = localStorage.getItem('selectedModel');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    selectedModelSlug = data.slug;
                } catch(e) {}
            }

            // Show loading overlay
            const overlay = document.getElementById('loadingOverlay');
            const container = document.getElementById('modelsContainer');
            if (showLoading) {
                overlay.style.display = 'flex';
                container.style.opacity = '0';
            }

            // Discover models from Supabase DB (populates models array directly)
            await discoverSlugs();

            // Render all models at once
            renderModels();

            // Fade in
            if (showLoading) {
                overlay.style.display = 'none';
                container.style.opacity = '1';
            }
        }

        async function loadModelConfig(slug) {
            try {
                const r = await fetch('modelos/' + slug + '/config.js');
                const t = await r.text();
                const nome = (t.match(/"nome":\s*"([^"]*)"/) || [,''])[1] || formatSlug(slug);
                const tipo = (t.match(/"tipo":\s*"([^"]*)"/) || [,''])[1] || '';
                const tema = (t.match(/"tema":\s*"([^"]*)"/) || [,''])[1] || '';
                const paletaCores = (t.match(/"paletaCores":\s*"([^"]*)"/) || [,''])[1] || '';
                const buttonColor = (t.match(/"buttonColor":\s*"([^"]*)"/) || [,''])[1] || '#c9557c';
                const capaPath = (t.match(/"capa":\s*"([^"]*)"/) || [,''])[1];
                const folhaPath = (t.match(/"folhaPreenchida":\s*"([^"]*)"/) || [,''])[1]
                    || (t.match(/"folha":\s*"([^"]*)"/) || [,''])[1]
                    || 'assets/folha.jpg';

                models.push({
                    slug,
                    name: nome,
                    tipo,
                    tema,
                    paletaCores,
                    buttonColor,
                    tags: buildTags(tipo),
                    coverPath: capaPath || 'assets/capa.jpg',
                    coverType: getAssetType(capaPath),
                    cover: getModelAssetUrl(slug, capaPath || 'assets/capa.jpg'),
                    sheetPath: folhaPath,
                    sheetType: getAssetType(folhaPath),
                    sheet: getModelAssetUrl(slug, folhaPath),
                    loaded: true
                });
            } catch(e) {
                models.push({
                    slug,
                    name: formatSlug(slug),
                    tipo: '',
                    tema: '',
                    paletaCores: '',
                    buttonColor: '#c9557c',
                    tags: [],
                    coverPath: 'assets/capa.jpg',
                    coverType: 'image',
                    cover: getModelAssetUrl(slug, 'assets/capa.jpg'),
                    sheetPath: 'assets/folha.jpg',
                    sheetType: 'image',
                    sheet: getModelAssetUrl(slug, 'assets/folha.jpg'),
                    loaded: true
                });
            }
        }

        // ============================
        // SECTIONS
        // ============================
        const sections = [
            { id: 'todos', title: 'Todos os Convites', filter: () => true },
            { id: 'aniversario', title: 'Aniversário', filter: m => isEventType(m, 'Aniversário') },
            { id: 'casamento', title: 'Casamento', filter: m => isEventType(m, 'Casamento') },
            { id: 'debutante', title: 'Debutante', filter: m => isDebutanteType(m.tipo) },
            { id: 'formatura', title: 'Formatura', filter: m => isEventType(m, 'Formatura') }
        ];

        // ============================
        // SELECT MODEL
        // ============================
        function selectModel(slug) {
            const model = models.find(m => m.slug === slug);
            if (!model) return;

            globalThis.MForgeMeta?.track('ViewContent', {
                content_ids: [model.slug],
                content_name: model.name,
                content_category: model.tipo || 'Convites digitais',
                content_type: 'product'
            });

            const modelData = {
                slug: model.slug,
                name: model.name,
                tema: model.tema,
                tipo: model.tipo,
                paletaCores: model.paletaCores,
                buttonColor: model.buttonColor,
                capa: model.coverType === 'image' && model.coverPath ? model.cover.replace(/^\//, '') : ''
            };

            localStorage.setItem('selectedModel', JSON.stringify(modelData));
            window.location.href = 'orcamentos/';
        }

        // ============================
        // CREATE CARD (for filtered renders)
        // ============================
        function placeholderSvg(label) {
            return 'data:image/svg+xml,' + encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600"><rect fill="#e5e7eb" width="900" height="1600"/><text fill="#9ca3af" x="450" y="800" text-anchor="middle" font-size="54">${label}</text></svg>`
            );
        }

        function createMediaMarkup(src, type, label, altText) {
            const fallback = placeholderSvg('Sem ' + label.toLowerCase());
            const safeLabel = escapeHtml(label);
            const safeAlt = escapeHtml(altText || label);
            const safeSrc = escapeHtml(src || fallback);
            const media = type === 'video'
                ? `<video data-src="${safeSrc}"
                         class="model-cover"
                         autoplay loop muted playsinline preload="none"></video>`
                : `<img data-src="${safeSrc}"
                         data-fallback="${fallback}"
                         alt="${safeAlt}"
                         class="model-cover">`;

            return `
                <div class="model-media-frame">
                    ${media}
                    <span class="model-media-label">${safeLabel}</span>
                </div>
            `;
        }

        function createModelCard(model, isSelected) {
            const card = document.createElement('div');
            card.className = `model-card relative ${isSelected ? 'selected' : ''}`;
            card.dataset.slug = model.slug;
            card.dataset.configLoaded = 'true';
            card.dataset.tags = normalizeText(model.tags.join(' '));
            card.dataset.name = normalizeText(model.name);
            card.dataset.colors = normalizeText(model.paletaCores);
            card.dataset.tema = normalizeText(model.tema);
            const coverMedia = createMediaMarkup(model.cover, model.coverType, 'Capa', model.name);
            const sheetMedia = createMediaMarkup(model.sheet, model.sheetType, 'Convite', model.name + ' - convite');

            card.innerHTML = `
                <div class="cover-click-area model-media-pair" onclick="openPreview(models.find(m=>m.slug==='${model.slug}'))" style="cursor:pointer">
                    ${coverMedia}
                    ${sheetMedia}
                </div>
                <div class="card-info">
                    <h3 class="card-name font-semibold text-sm mb-0.5 line-clamp-1">${model.name}</h3>
                    <p class="card-colors text-xs text-accent line-clamp-1">${model.paletaCores || model.tema || ''}</p>
                    <div class="flex-1"></div>
                    <button onclick="event.stopPropagation(); selectModel('${model.slug}')"
                            class="w-full py-1.5 px-2 rounded-lg text-[11px] font-medium bg-gradient-to-r from-[#c9557c] to-[#a84466] text-white">
                        ${isSelected ? '\u2713 Selecionado' : 'Escolher'}
                    </button>
                    <button onclick="event.stopPropagation(); openPreview(models.find(m=>m.slug==='${model.slug}'))"
                       class="w-full py-1.5 px-2 rounded-lg text-[11px] text-center border mt-1" style="background:var(--bg-secondary);border-color:var(--border-color);color:var(--text-primary)">
                        Ver Prévia
                    </button>
                </div>
            `;

            return card;
        }

        // ============================
        // CREATE SECTION
        // ============================
        function createSection(section, filteredModels) {
            const sectionModels = filteredModels.filter(section.filter);
            if (sectionModels.length === 0) return null;

            const sectionEl = document.createElement('section');
            sectionEl.className = 'mb-12';
            sectionEl.dataset.section = section.id;

            sectionEl.innerHTML = `
                <h2 class="section-title">${section.title} <span class="text-sm font-normal text-gray-400">(${sectionModels.length})</span></h2>
                <div class="models-gallery-grid"></div>
            `;

            const track = sectionEl.querySelector('.models-gallery-grid');
            sectionModels.forEach(model => {
                track.appendChild(createModelCard(model, model.slug === selectedModelSlug));
            });

            return sectionEl;
        }

        // ============================
        // RENDER (for search/filter)
        // ============================
        function getSearchTokens(searchValue) {
            return normalizeText(searchValue).split(/\s+/).filter(t => t.length > 0);
        }

        function applySearchFilters(modelList, searchTerm) {
            let terms = getSearchTokens(searchTerm);
            let filtered = [...modelList];

            const hasDebutanteAlias = terms.includes('debutante')
                || terms.includes('15anos')
                || terms.includes('quinze')
                || (terms.includes('15') && terms.includes('anos'));

            if (hasDebutanteAlias) {
                filtered = filtered.filter(m => isDebutanteType(m.tipo));
                terms = terms.filter(t => !['debutante', '15', 'anos', '15anos', 'quinze'].includes(t));
            }

            const typeFilters = [
                { token: 'aniversario', match: m => isEventType(m, 'Aniversário') },
                { token: 'casamento', match: m => isEventType(m, 'Casamento') },
                { token: 'formatura', match: m => isEventType(m, 'Formatura') }
            ];

            typeFilters.forEach(typeFilter => {
                if (terms.includes(typeFilter.token)) {
                    filtered = filtered.filter(typeFilter.match);
                    terms = terms.filter(t => t !== typeFilter.token);
                }
            });

            if (terms.length > 0) {
                filtered = filtered.filter(m => {
                    const searchable = normalizeText([
                        m.name,
                        m.paletaCores,
                        m.tema,
                        m.tipo,
                        ...(m.tags || [])
                    ].join(' '));
                    return terms.every(t => searchable.includes(t));
                });
            }

            return filtered.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
        }

        function renderModels(searchTerm = '') {
            const container = document.getElementById('modelsContainer');
            container.innerHTML = '';

            let filteredModels = [...models];

            if ((searchTerm || '').trim()) {
                filteredModels = applySearchFilters(filteredModels, searchTerm);
            }

            sections.forEach(section => {
                const sectionEl = createSection(section, filteredModels);
                if (sectionEl) {
                    container.appendChild(sectionEl);
                }
            });

            observeRenderedCards();
        }

        // ============================
        // SEARCH / SUGGESTIONS
        // ============================
        function toggleSuggestion(term) {
            const btn = document.querySelector(`.suggestion-btn[data-term="${term}"]`);
            const input = document.getElementById('searchInput');
            const currentValue = input.value.trim();

            if (btn.classList.contains('active')) {
                const tokensToRemove = getSearchTokens(term);
                input.value = currentValue
                    .split(/\s+/)
                    .filter(t => !tokensToRemove.includes(normalizeText(t)))
                    .join(' ');
                btn.classList.remove('active');
                btn.innerHTML = `<span>${term}</span>`;
            } else {
                const newValue = currentValue ? `${currentValue} ${term}` : term;
                input.value = newValue;
                btn.classList.add('active');
                btn.innerHTML = `<span>${term}</span><span class="ml-1 opacity-70">✕</span>`;
            }

            renderModels(input.value);
            updateSuggestionButtons(input.value);
        }

        function updateSuggestionButtons(searchValue) {
            const terms = getSearchTokens(searchValue);
            document.querySelectorAll('.suggestion-btn').forEach(btn => {
                const btnTerms = getSearchTokens(btn.dataset.term);
                const isActive = btnTerms.length > 0 && btnTerms.every(t => terms.includes(t));
                btn.classList.toggle('active', isActive);
                if (isActive) {
                    btn.innerHTML = `<span>${btn.dataset.term}</span><span class="ml-1 opacity-70">✕</span>`;
                } else {
                    btn.innerHTML = `<span>${btn.dataset.term}</span>`;
                }
            });
        }

        let metaSearchTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderModels(e.target.value);
            updateSuggestionButtons(e.target.value);
            clearTimeout(metaSearchTimer);
            const term = e.target.value.trim();
            if (term.length >= 2) {
                metaSearchTimer = setTimeout(() => {
                    globalThis.MForgeMeta?.track('Search', { search_string: term.slice(0, 100) });
                }, 800);
            }
        });

        // ============================
        // INIT & POLLING
        // ============================
        initCoverObserver();
        loadModels().then(() => {
            // Se houver um parametro 'modelo' na URL, abre automaticamente a prévia correspondente
            const params = new URLSearchParams(window.location.search);
            const modeloSlug = params.get('modelo');
            if (modeloSlug) {
                const modelToOpen = models.find(m => m.slug === modeloSlug);
                if (modelToOpen) {
                    setTimeout(() => openPreview(modelToOpen), 300);
                }
            }
        });

        // Poll for model changes every 15 seconds
        setInterval(async () => {
            const changed = await discoverSlugs();
            if (changed) {
                // Re-render (models already populated by discoverSlugs)
                renderModels();
            }
        }, 15000);
    </script>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Modelos (145) — MForge Convites</title>
  <meta name="description" content="Explore 145 modelos de convites interativos. Filtre por evento, tema ou cor, veja uma demonstração e monte seu orçamento.">
  <link rel="stylesheet" href="css/fonts.css?v=20261002-1">
  <link rel="stylesheet" href="css/base.css?v=20261002-13">
  <link rel="stylesheet" href="css/catalog.css?v=20261021-aberturas-1">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="brand-link" aria-label="MForge Convites - Página Inicial">
        <span class="brand-name">MForge Convites</span>
      </a>
      <nav class="site-nav" aria-label="Navegação Principal">
        <a href="index.html">Início</a>
        <a href="modelos.html" class="active" aria-current="page">Modelos</a>
        <a href="orcamentos/index.html" class="site-nav-cta">Orçamento</a>
        <button type="button" class="site-nav-theme" data-theme-toggle aria-label="Ativar tema escuro" aria-pressed="false"><span class="toggle-knob" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l-.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg></span></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="catalog-header">
      <div class="container">
        <div class="catalog-title-group">
          <h1 class="font-serif catalog-main-title">Escolha um modelo</h1>
        </div>

        <div class="catalog-search-row">
          <label for="catalog-search" class="sr-only">Buscar modelo por nome, tema ou paleta de cores</label>
          <input 
            type="search" 
            id="catalog-search" 
            class="catalog-search-input" 
            placeholder="Buscar modelo, tema ou cor…"
            autocomplete="off"
          >
          <button type="button" class="btn btn-secondary" id="catalog-clear-search" style="min-height: 42px;">Limpar</button>
        </div>
      </div>
    </div>

    <div class="catalog-filter-region">
      <div class="container">
          <div class="catalog-filter-tabs" id="catalog-filters" role="group" aria-label="Filtrar por Categoria de Evento">
            <span style="font-size: 0.85rem; font-weight: 600; color: var(--color-ink); margin-right: 4px;">Categorias:</span>
            <button type="button" class="filter-chip active" data-category="all" aria-pressed="true">Todos (145)</button>
            <button type="button" class="filter-chip" data-category="Aniversário" aria-pressed="false">Aniversário (114)</button>
            <button type="button" class="filter-chip" data-category="Casamento" aria-pressed="false">Casamento (14)</button>
            <button type="button" class="filter-chip" data-category="Debutante" aria-pressed="false">Debutante / 15 anos (12)</button>
            <button type="button" class="filter-chip" data-category="Formatura" aria-pressed="false">Formatura (3)</button>
          </div>

          <div class="catalog-meta-bar">
            <div id="catalog-count" aria-live="polite">Carregando catálogo...</div>
            <div style="font-size: 0.8rem; color: var(--color-muted);">Base: R$ 80 / Personalização de tema: +R$ 10</div>
          </div>
      </div>
    </div>

    <!-- Região com Live Feedback de Acessibilidade -->
    <div id="catalog-live" class="sr-only" aria-live="polite"></div>

    <section class="catalog-section">
      <div class="container">
        <div class="catalog-grid" id="catalog-grid">
          <!-- Inserido dinamicamente via catalog.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Modal de Prévia Interativa -->
  <div class="preview-modal-backdrop" id="preview-modal-backdrop" hidden>
    <div class="preview-modal" role="dialog" aria-labelledby="preview-modal-title" aria-modal="true">
      <div class="preview-modal-head">
        <h3 id="preview-modal-title">Demonstração do Modelo</h3>
        <button type="button" class="preview-modal-close" id="preview-modal-close" aria-label="Fechar prévia">&times;</button>
      </div>
      <div class="preview-modal-opening" id="preview-modal-opening" role="group" aria-label="Tipo de abertura" hidden>
        <button type="button" class="opening-option" data-opening="longa" aria-pressed="true">Abertura longa</button>
        <button type="button" class="opening-option" data-opening="curta" aria-pressed="false">Abertura curta</button>
      </div>
      <div class="preview-modal-body">
        <iframe 
          id="preview-modal-iframe" 
          class="preview-modal-iframe" 
          src="about:blank"
          title="Prévia do modelo selecionado"
          referrerpolicy="no-referrer"
        ></iframe>
      </div>
      <div class="preview-modal-foot">
        <button type="button" id="preview-modal-copy" class="btn btn-secondary" style="font-size: 0.85rem;">Copiar link da prévia</button>
        <a 
          id="preview-modal-external" 
          href="#" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn btn-secondary"
          style="font-size: 0.85rem;"
        >
          Abrir em nova aba ↗
        </a>
        <button 
          type="button" 
          id="preview-modal-select" 
          class="btn btn-primary"
          style="font-size: 0.85rem;"
        >
          Escolher este modelo
        </button>
      </div>
      <span class="sr-only" id="preview-copy-feedback" role="status" aria-live="polite"></span>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; MForge Convites Digitais — 145 Modelos Catalogados.</div>
        <div><a href="orcamentos/index.html">Ir para orçamento sem escolher modelo</a></div>
      </div>
    </div>
  </footer>

  <script src="js/catalog.js?v=20261021-aberturas-1"></script>
  <script src="js/theme.js?v=20261002-4" defer></script>
</body>
</html>

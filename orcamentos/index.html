<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Orçamento — MForge Convites</title>
  <meta name="description" content="Configure seu convite interativo em 14 etapas progressivas. Escolha músicas, confirmação de presença, presentes e confira o valor em tempo real com total clareza.">
  <link rel="stylesheet" href="../css/fonts.css?v=20261002-1">
  <link rel="stylesheet" href="../css/base.css?v=20261002-13">
  <link rel="stylesheet" href="../css/budget.css?v=20261023-obrigatorios-5">
  <link rel="stylesheet" href="../css/budget-media.css?v=20261014-opening-choice-1">
</head>
<body class="budget-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a href="../index.html" class="brand-link" aria-label="MForge Convites - Página Inicial">
        <span class="brand-name">MForge Convites</span>
      </a>
      <nav class="site-nav" aria-label="Navegação Principal">
        <a href="../index.html">Início</a>
        <a href="../modelos.html">Modelos</a>
        <a href="index.html" class="active site-nav-cta" aria-current="page">Orçamento</a>
        <button type="button" class="site-nav-theme" data-theme-toggle aria-label="Ativar tema escuro" aria-pressed="false"><span class="toggle-knob" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l-.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg></span></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="budget-layout">
        <!-- Container principal do fluxo progressivo (14 etapas) -->
        <section id="step-container" class="step-container" aria-live="polite">
          <!-- Renderizado dinamicamente via budget.js -->
        </section>

        <!-- Barra Lateral de Resumo e Preço (Desktop) -->
        <aside class="budget-sidebar" aria-label="Resumo do Orçamento Atual">
          <div class="sidebar-header">
            <h3 class="sidebar-title">Seu Orçamento</h3>
            <div id="sidebar-total" class="sidebar-live-total">Escolha uma opção</div>
          </div>

          <ul class="sidebar-item-list" id="sidebar-items">
            <!-- Itens discriminados -->
          </ul>

          <div class="sidebar-notice">
            <strong>Transparência MForge:</strong>
            <p style="margin-top: 4px;">Valores calculados em tempo real. Sinal fixo de R$ 20 para início da produção após alinhamento.</p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <!-- Barra Inferior Fixa para Dispositivos Móveis -->
  <div class="mobile-budget-bar" aria-label="Total do Orçamento Móvel">
    <p class="mobile-reassure" id="mobile-reassure"></p>
    <div class="mobile-budget-bar-inner">
      <div class="mobile-total-info">
        <span>Total</span>
        <strong id="mobile-total">Escolha uma opção</strong>
      </div>
      <button type="button" class="btn btn-primary" id="mobile-step-next">
        Próximo
      </button>
      <button type="button" class="btn btn-outline mobile-summary-final" id="mobile-summary-final" hidden>Resumo Final</button>
    </div>
  </div>

  <dialog id="demo-dialog" class="demo-dialog" aria-labelledby="demo-title">
    <div class="demo-dialog-shell">
      <header class="demo-dialog-head">
        <div>
          <p class="demo-dialog-eyebrow">Experiência de exemplo</p>
          <h2 id="demo-title">Demonstração</h2>
        </div>
        <button type="button" class="demo-dialog-close" id="demo-dialog-close" aria-label="Fechar demonstração">&times;</button>
      </header>
      <div class="demo-dialog-content" id="demo-dialog-content"></div>
    </div>
  </dialog>

  <dialog id="notice-dialog" class="notice-dialog" aria-labelledby="notice-title" aria-describedby="notice-message">
    <div class="notice-shell">
      <span class="notice-stamp" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.2"/><path d="m3.8 7.2 8.2 6.3 8.2-6.3"/></svg></span>
      <p class="notice-eyebrow">Orçamento MForge</p>
      <h2 id="notice-title">Atenção</h2>
      <p id="notice-message" class="notice-message"></p>
      <div class="notice-actions">
        <button type="button" class="btn btn-outline" id="notice-cancel" hidden>Cancelar</button>
        <button type="button" class="btn btn-primary" id="notice-confirm">Entendi</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="../js/budget.js?v=20261023-obrigatorios-5"></script>
  <script src="../js/theme.js?v=20261002-4" defer></script>
</body>
</html>

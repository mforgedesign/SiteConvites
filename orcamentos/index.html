<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf5f5">
  <title>Susie | Orçamento</title>
  <meta name="description" content="Monte o orçamento do seu convite com a Susie.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="page-shell">
    <section class="welcome" id="welcome">
      <div class="welcome-mark" aria-hidden="true">
        <span class="sparkle">✦</span>
        <span class="avatar avatar-large">S</span>
      </div>
      <p class="eyebrow">SEU CONVITE, DO SEU JEITINHO</p>
      <h1>Vamos criar algo<br><em>inesquecível?</em></h1>
      <p class="welcome-copy">A Susie te ajuda a montar seu convite e calcular tudo, de um jeito simples e encantador.</p>
      <button class="primary-button" id="start-chat">
        <span>Começar meu orçamento</span><span aria-hidden="true">✨</span>
      </button>
      <p class="welcome-note">Leva só alguns minutinhos · sem compromisso</p>
    </section>

    <section class="chat-app" id="chat-app" aria-label="Chat de orçamento" hidden>
      <header class="chat-header">
        <div class="susie-profile">
          <span class="avatar">S</span>
          <div>
            <h2>Susie <span>| Orçamento</span></h2>
          </div>
        </div>
        <button class="restart-button" id="restart" aria-label="Recomeçar orçamento"><span aria-hidden="true">↻</span> Recomeçar</button>
      </header>

      <div class="progress-wrap" aria-label="Progresso do orçamento">
        <div class="progress-copy"><span id="progress-label">Vamos começar</span><span id="progress-number">1 de 5</span></div>
        <div class="progress-track"><span id="progress-bar"></span></div>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>
      <button class="more-indicator" id="more-indicator" aria-label="Ver mais conteúdo" hidden>↓</button>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="message-input" rows="3" autocomplete="off" aria-label="Sua resposta"></textarea>
          <button type="submit" id="send-button" aria-label="Enviar resposta">➜</button>
        </form>
        <div class="bottom-bar">
          <div class="budget">
            <span>VALOR ATUAL</span>
            <strong id="total-price">R$ 80</strong>
          </div>
          <button class="help-button" id="help-button"><span>♡</span> Ajuda</button>
        </div>
      </div>
    </section>
  </main>

  <template id="typing-template">
    <div class="message-row susie typing-row">
      <span class="mini-avatar">S</span>
      <div class="bubble typing"><i></i><i></i><i></i></div>
    </div>
  </template>

  <div class="asset-modal" id="asset-modal" role="dialog" aria-modal="true" aria-label="Visualização ampliada" hidden>
    <button class="asset-modal-close" id="asset-modal-close" aria-label="Fechar visualização">×</button>
    <div class="asset-modal-content" id="asset-modal-content"></div>
    <button class="asset-modal-select" id="asset-modal-select" hidden>Escolher</button>
  </div>

  <script src="../js/meta-pixel.js"></script>
  <script src="js/tracking-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

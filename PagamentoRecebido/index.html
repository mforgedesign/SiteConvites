<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Pagamento Confirmado!</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath fill='%23fff' d='M12 22c0-3.3 2.7-6 6-6h28c3.3 0 6 2.7 6 6v20c0 3.3-2.7 6-6 6H18c-3.3 0-6-2.7-6-6V22zm6-1.5 14 12 14-12H18zm29 6.1L34.6 37.2a4 4 0 0 1-5.2 0L17 26.6V42c0 .6.4 1 1 1h28c.6 0 1-.4 1-1V26.6z'/%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1a1a1a',
                        secondary: '#2d2d2d',
                        accent: '#e63946',
                        'accent-light': '#f1faee'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .success-bg {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
        }
    </style>
</head>
<body class="success-bg min-h-screen flex items-center justify-center p-4">
    <div class="bg-secondary rounded-2xl shadow-2xl w-full max-w-lg p-8 text-center border border-gray-700 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-accent to-pink-500"></div>
        
        <div class="w-16 h-16 mx-auto bg-green-900/40 rounded-full flex items-center justify-center mb-6 shadow-inner border border-green-500/30">
            <i class="fa-solid fa-check text-3xl text-green-400"></i>
        </div>
        
        <h1 class="text-3xl font-extrabold text-white mb-2">Pagamento Recebido!</h1>
        <p class="text-gray-300 mb-8 leading-relaxed">
            Para que seu pedido entre em nossa fila de produção, clique no botão abaixo!
        </p>
        
        <a id="confirmBtn" href="#" target="_blank" class="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-bold py-4 px-6 rounded-xl shadow-lg border border-[#128C7E] transition-all flex items-center justify-center gap-3 hover:scale-[1.02] text-lg">
            <i class="fa-brands fa-whatsapp text-2xl"></i>
            Confirmar Pedido no WhatsApp
        </a>
        
        <button onclick="window.location.href='../'" class="mt-8 text-sm text-gray-400 hover:text-accent transition-colors font-medium">
            <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao site
        </button>
    </div>

    <script>
        const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

        function generateSummary() {
            const urlParams = new URLSearchParams(window.location.search);
            let clientName = urlParams.get('name') || urlParams.get('nome');
            let summaryTexto = '';

            try {
                const savedData = localStorage.getItem('quoteData');
                const savedModel = localStorage.getItem('selectedModel');
                
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    const model = savedModel ? JSON.parse(savedModel) : null;
                    
                    clientName = clientName || parsed.clientName;
                    
                    const modelName = model && model.name ? model.name : 'Modelo não selecionado';
                    const modelSlug = model && model.slug ? model.slug : '';
                    
                    const siteRoot = new URL('../', window.location.href).href;
                    const modelLink = modelSlug ? siteRoot + 'modelos.html?modelo=' + encodeURIComponent(modelSlug) : '';

                    summaryTexto += "*PEDIDO DE CONVITE DIGITAL*\n";
                    summaryTexto += "━━━━━━━━━━━━━━━━━━━━━━━━\n\n";
                    
                    summaryTexto += "*📋 MODELO ESCOLHIDO*\n";
                    summaryTexto += `${modelName}\n`;
                    if (modelLink) summaryTexto += `Link: ${modelLink}\n`;
                    summaryTexto += "\n*FUNÇÕES SELECIONADAS:*\n";

                    if(parsed.basePackage !== undefined) {
                        let pkgName = '';
                        if(parsed.basePackage === 85) pkgName = 'Abertura Premium (Longa)';
                        else if(parsed.basePackage === 60) pkgName = 'Simples (Curta)';
                        else if(parsed.basePackage === 0) pkgName = 'Sem Abertura (Layout Fixo)';
                        else pkgName = 'Pacote Selecionado';
                        summaryTexto += `- ${pkgName} (${formatter.format(parsed.basePackage)})\n`;
                    }

                    if(parsed.giftTipType && parsed.giftTipType !== 'none') {
                        const giftMap = { 'simples': 'Sugestão de Presentes (Simples)', 'premium': 'Sugestão de Presentes (Premium)', 'inteligente': 'Aviso de Lista Inteligente', 'sua_lista': 'Link para Sua Lista' };
                        summaryTexto += `- ${giftMap[parsed.giftTipType] || 'Sugestão de Presentes'}\n`;
                    }

                    if(parsed.rsvpType && parsed.rsvpType !== 'none') {
                        const rsvpMap = { 'whatsapp': 'Confirmação via WhatsApp', 'formulario': 'RSVP em Formulário' };
                        summaryTexto += `- ${rsvpMap[parsed.rsvpType] || 'Confirmação de Presença'}\n`;
                    }

                    if(parsed.manualType && parsed.manualType !== 'none') {
                        summaryTexto += `- Manual do Convidado\n`;
                    }

                    if (parsed.extras && parsed.extras.length > 0) {
                        parsed.extras.forEach(ext => {
                            if(ext === 'musica') summaryTexto += `- Música do Convite\n`;
                            else if(ext === 'cronometro') summaryTexto += `- Cronômetro Regressivo\n`;
                            else if(ext === 'lembrete') summaryTexto += `- Lembrete\n`;
                            else if(ext === 'savethedate') summaryTexto += `- Save The Date\n`;
                            else if(ext === 'galeria') summaryTexto += `- Galeria de Fotos\n`;
                            else if(ext === 'playlist') summaryTexto += `- Playlist dos Convidados\n`;
                            else summaryTexto += `- ${ext}\n`;
                        });
                    }

                    const total = (parsed.basePackage || 0) + (parsed.giftTipExtra || 0) + (parsed.rsvpExtra || 0) + (parsed.manualExtra || 0) + (parsed.extrasExtra || 0);
                    summaryTexto += `\n*💰 TOTAL: ${formatter.format(total)}*\n\n`;

                    summaryTexto += "━━━━━━━━━━━━━━━━━━━━━━━━\n";
                    summaryTexto += "*📝 DADOS DO EVENTO*\n";
                    if(parsed.eventName) summaryTexto += `- Nome(s): ${parsed.eventName}\n`;
                    if(parsed.eventType) summaryTexto += `- Tipo: ${parsed.eventType === 'outro' ? parsed.customEventType : parsed.eventType}\n`;
                    if(parsed.eventTheme) summaryTexto += `- Tema: ${parsed.eventTheme}\n`;
                    if(parsed.eventColorPalette) summaryTexto += `- Cores: ${parsed.eventColorPalette}\n`;
                    if(parsed.eventDate) summaryTexto += `- Data: ${parsed.eventDate}\n`;
                    if(parsed.eventTimeStart) summaryTexto += `- Horário: ${parsed.eventTimeStart}${parsed.eventTimeEnd ? ' às ' + parsed.eventTimeEnd : ''}\n`;
                    if(parsed.eventLocation) summaryTexto += `- Endereço: ${parsed.eventLocation}\n`;
                    if(parsed.clientWhatsapp) summaryTexto += `- WhatsApp Confirmação: ${parsed.clientWhatsapp}\n`;

                    if(parsed.extras && parsed.extras.includes('musica') && parsed.musicCustomText) {
                        summaryTexto += `- Link da Música: ${parsed.musicCustomText}\n`;
                    }
                    
                    if(parsed.giftTipType !== 'none' || parsed.manualType !== 'none') {
                        summaryTexto += `\n`;
                        if(parsed.giftTipType !== 'none' && (parsed.giftCustomText || parsed.giftLinkUrl)) {
                            summaryTexto += `*🎁 SUGESTÕES DE PRESENTES:*\n`;
                            if(parsed.giftCustomText) summaryTexto += `${parsed.giftCustomText}\n`;
                            if(parsed.giftLinkUrl) summaryTexto += `${parsed.giftLinkUrl}\n`;
                        }
                        
                        if(parsed.manualType !== 'none' && parsed.manualCustomText) {
                            summaryTexto += `\n*📖 MANUAL DO CONVIDADO*\n`;
                            summaryTexto += `${parsed.manualCustomText}\n`;
                        }
                    }

                    summaryTexto += `\n_Orçamento feito pelo site_\n`;
                }
            } catch (e) {
                console.error("Erro ao ler localStorage:", e);
            }

            return summaryTexto;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const summary = generateSummary();
            const adminNumber = '5511939047235';
            const wppUrl = `https://api.whatsapp.com/send?phone=${adminNumber}&text=${encodeURIComponent(summary)}`;
            document.getElementById('confirmBtn').href = wppUrl;
        });
    </script>
</body>
</html>

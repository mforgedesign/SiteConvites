<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Convite Digital Interativo</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0a0a0a',
                        primary: '#ffffff',
                        accent: '#c9557c',
                        'accent-light': '#e8a0b8',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fafafa;
        }
        body {
            background-color: var(--bg-color);
            /* Prevent overscroll bounce on mobile */
            overscroll-behavior-y: none;
        }
        .gradient-text {
            background: linear-gradient(135deg, #c9557c, #e8a0b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .iframe-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
        }
        .iframe-container {
            position: relative;
            height: 100%;
            aspect-ratio: 9 / 16;
            max-width: 100%;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(201, 85, 124, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border: 4px solid white;
            background-color: #f3f4f6;
        }
        .iframe-container iframe {
            width: 133.33%;
            height: 133.33%;
            transform: scale(0.75);
            transform-origin: top left;
            border: none;
            /* smooth iframe display */
            opacity: 0;
            animation: fadeIn 0.5s ease forwards 0.3s;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.5rem;
            border-radius: 1rem;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            width: 100%;
            letter-spacing: -0.01em;
        }
        .btn-primary {
            background: linear-gradient(135deg, #c9557c 0%, #b04669 100%);
            color: white;
            box-shadow: 0 4px 15px -3px rgba(201, 85, 124, 0.4);
            border: none;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background-color: white;
            color: #c9557c;
            border: 2px solid #f1d7e1;
            box-shadow: 0 2px 8px -2px rgba(201, 85, 124, 0.1);
        }
        .btn-secondary:active {
            background-color: #fdf2f5;
            border-color: #c9557c;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="antialiased font-sans text-gray-800">

    <!-- App Container -->
    <main class="w-full max-w-[480px] mx-auto h-[100dvh] flex flex-col p-4 sm:p-6 overflow-hidden relative">
        
        <!-- Decorative bg blobs (subtle) -->
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[30%] bg-pink-200 rounded-full blur-3xl opacity-40 -z-10 mix-blend-multiply"></div>
        <div class="absolute bottom-[20%] right-[-10%] w-[40%] h-[40%] bg-purple-200 rounded-full blur-3xl opacity-30 -z-10 mix-blend-multiply"></div>

        <!-- Header Area -->
        <header class="text-center shrink-0 mb-3 sm:mb-5 pt-1 sm:pt-2">
            <h1 class="text-2xl sm:text-3xl font-black mb-1 gradient-text tracking-tight leading-tight">
                Convite Digital Interativo
            </h1>
            <p class="text-[13px] sm:text-sm font-semibold text-gray-500 max-w-[280px] sm:max-w-md mx-auto leading-snug">
                Que tal dar uma olhada em um dos nossos modelos mais recentes?
            </p>
        </header>

        <!-- Dynamic Iframe Area -->
        <div class="iframe-wrapper w-full mb-4 sm:mb-6">
            <div class="iframe-container">
                <!-- Loading Indicator -->
                <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none -z-10 gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-accent/50"></i>
                    <span class="text-xs text-gray-400 font-medium">Carregando convite...</span>
                </div>
                
                <iframe id="demoIframe" title="Demonstração do Convite" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Action Buttons Area -->
        <div class="shrink-0 flex flex-col gap-2.5 sm:gap-3 pb-1 sm:pb-2">
            <a href="modelos.html" class="btn btn-secondary text-[15px] sm:text-base">
                Quero ver modelos
            </a>
            <a href="orcamentos/" class="btn btn-primary text-[15px] sm:text-base flex items-center gap-2">
                Consultar Valores <i class="fa-solid fa-arrow-right text-sm"></i>
            </a>
        </div>

    </main>

    <script>
    (async function() {
        const SUPABASE_URL = 'https://xchphsltccopelblbsyb.supabase.co';
        const OLD_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjaHBoc2x0Y2NvcGVsYmxic3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMDk0MTAsImV4cCI6MjA1Njc4NTQxMH0.8e2V0H1xRJi_3w_GYWOWn8dWfAEcPqS8mPR3k5U0hMo';
        const NEW_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjaHBoc2x0Y2NvcGVsYmxic3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTI1MjQsImV4cCI6MjA4OTIyODUyNH0.ZOtoygT-PZKcByjh2GEzKGX--6K1UqedvVqTlhCAko0';
        const CODE_URL = SUPABASE_URL + '/storage/v1/object/public/modelos-code';
        try {
            const r = await fetch(CODE_URL + '/modelo-cinderela/index.html');
            let html = await r.text();
            html = html.replace(new RegExp(OLD_KEY.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), NEW_KEY);
            const ASSETS_URL = SUPABASE_URL + '/storage/v1/object/public/modelos';
            const ASSET_BASE = ASSETS_URL + '/modelo-cinderela/assets/';
            const assetFix = '<script>' +
              "window.__SUPABASE_ASSETS='" + ASSETS_URL + '/modelo-cinderela' + "';" +
              "window.assetUrl=function(p){return window.__SUPABASE_ASSETS+'/assets/'+(p||'').replace('assets/','')};" +
              "(function(){" +
              "var AB='" + ASSET_BASE + "';" +
              "function fix(v){return v&&typeof v==='string'&&v.indexOf('assets/')===0?AB+v.substring(7):v;}" +
              // Patch setAttribute
              "var _sa=Element.prototype.setAttribute;" +
              "Element.prototype.setAttribute=function(n,v){if(n==='src'||n==='data-src'||n==='poster')v=fix(v);return _sa.call(this,n,v);};" +
              // Patch .src property setter for img, video, source, audio
              "function patchSrc(Cls){var d=Object.getOwnPropertyDescriptor(Cls.prototype,'src');if(!d||!d.set)return;var _s=d.set;Object.defineProperty(Cls.prototype,'src',{set:function(v){_s.call(this,fix(v));},get:d.get,configurable:true});}" +
              "patchSrc(HTMLImageElement);patchSrc(HTMLVideoElement);patchSrc(HTMLSourceElement);patchSrc(HTMLAudioElement);" +
              // Patch __loadConfig to rewrite config asset paths
              "var _ld=window.__loadConfig;" +
              "window.__loadConfig=async function(){" +
              "await _ld();" +
              "if(window.config){" +
              "['assets','imagens','backgrounds'].forEach(function(k){" +
              "if(window.config[k]&&typeof window.config[k]==='object'){" +
              "for(var p in window.config[k]){" +
              "var v=window.config[k][p];" +
              "if(typeof v==='string')window.config[k][p]=fix(v);" +
              "else if(Array.isArray(v))window.config[k][p]=v.map(function(x){return typeof x==='string'?fix(x):x;});" +
              "}}});" +
              "if(window.config.musica)window.config.musica=fix(window.config.musica);" +
              "}};" +
              "})();" +
              '<\/script>';
            html = html.replace('</head>', assetFix + '</head>');
            html = html.replace('init();', 'window.__loadConfig().then(init).catch(init);');
            document.getElementById('demoIframe').srcdoc = html;
        } catch(e) { console.error('Demo load error:', e); }
    })();
    </script>

</body>
</html>

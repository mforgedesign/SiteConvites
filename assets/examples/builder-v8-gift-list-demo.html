const fetch=async function(url,options={}){
  const target=String(url);
  if(target===endpoint)return {ok:true,status:200,json:async()=>({success:true,list:JSON.parse(JSON.stringify(__mforgeGiftDemoList))})};
  const reservePrefix=endpoint+'/items/';
  if(target.startsWith(reservePrefix)&&String(options.method||'GET').toUpperCase()==='POST'){
    const itemId=decodeURIComponent(target.slice(reservePrefix.length).split('/')[0]);
    const item=__mforgeGiftDemoList.items.find(candidate=>candidate.itemId===itemId);
    if(!item)return {ok:false,status:404,json:async()=>({error:'Presente não encontrado.'})};
    if(item.availability==='reserved')return {ok:false,status:409,json:async()=>({error:'Este presente já foi escolhido.'})};
    if(__mforgeGiftDemoList.reservationEnabled)item.availability='reserved';
    return {ok:true,status:200,json:async()=>({success:true,reserved:__mforgeGiftDemoList.reservationEnabled})};
  }
  throw new Error('Esta prévia usa somente dados locais.');
};

async function confirmGift(){if(!selectedItem)return;const guestName=normalizedName(nameInput.value);if(!guestName){showError('Informe seu nome e sobrenome.');nameInput.focus();return}if(guestName.length>160){showError('O nome deve ter no máximo 160 caracteres.');nameInput.focus();return}confirmButton.disabled=true;confirmButton.textContent='Confirmando…';try{await reserve(selectedItem,guestName);const item=selectedItem;closeName();const d=item.destination||{};if(d.kind==='store'||d.kind==='payment-link'){openExternal(d.url);return}if(d.kind==='pix'){openPix(item);return}showError('Este presente está disponível apenas para visualização.')}catch(error){confirmButton.disabled=false;confirmButton.textContent='Confirmar escolha';showError(error.message)}}
function renderGlobalPix(root){const key=String(list.pixKey||'').trim();if(!key||!list.paymentsEnabled)return;const box=text('section','', 'gift-global-pix');box.append(text('h2','Contribuição via Pix'));box.append(text('p','Prefere contribuir com outro valor? Copie a chave abaixo.'));const row=text('div','', 'gift-pix-row'),keyEl=text('span',key,'gift-pix-key'),button=text('button','Copiar Pix','gift-copy'),status=text('p','','gift-copy-status');button.type='button';button.onclick=()=>copyValue(key,button,status);row.append(keyEl,button);box.append(row,status);root.append(box)}
function render(){const v=list.visualConfig||{},root=text('div','', 'gift-shell');root.style.setProperty('--gift-title',v.titleColor||'#5b2c83');root.style.setProperty('--gift-accent',v.accentColor||'#76518f');root.style.setProperty('--gift-button',v.buttonColor||'#5b2c83');root.style.setProperty('--gift-text',v.textColor||'#3f2e25');document.body.style.background=v.backgroundColor||'#fffaf5';const head=text('header','', 'gift-head');head.append(text('h1',v.title||list.listLabel||'Lista de Presentes'));if(v.subtitle)head.append(text('p',v.subtitle,'subtitle'));if(v.notice)head.append(text('p',v.notice,'gift-notice'));root.append(head);const grid=text('div','', 'gift-grid');(list.items||[]).forEach((item,index)=>{const d=item.destination||{},reserved=item.availability==='reserved',actionable=!reserved&&d.kind!=='none'&&d.kind!=='invalid',card=text('article','', 'gift-card'+(reserved?' is-reserved':''));const image=document.createElement('img');image.src=item.imageAsset?.url||'';image.alt=item.name||'Presente '+String(index+1).padStart(2,'0');card.append(image);const body=text('div','', 'gift-card-body');body.append(text('h2',item.name||'Presente '+String(index+1).padStart(2,'0')));if(item.brand)body.append(text('p',item.brand));if(d.showPrice&&Number.isInteger(item.priceCents))body.append(text('p',money(item.priceCents),'gift-price'));const button=text('button',reserved?'Já presenteado':d.kind==='store'?'Ver na loja':d.kind==='payment-link'||d.kind==='pix'?'Dar este presente':'Somente visualização','gift-cta');button.type='button';button.disabled=!actionable;if(actionable)button.onclick=()=>choose(item);body.append(button);card.append(body);grid.append(card)});root.append(grid);renderGlobalPix(root);root.append(text('footer','Sua presença já é o maior presente desta celebração.','gift-footer'));app.className='';app.replaceChildren(root)}
async function load(){const response=await fetch(endpoint,{cache:'no-store'}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não foi possível carregar a lista de presentes.');if(!data.list)throw new Error('A lista de presentes não está disponível.');list=data.list;render()}
document.getElementById('closeName').onclick=closeName;document.getElementById('cancelName').onclick=closeName;document.getElementById('confirmGift').onclick=confirmGift;document.getElementById('closePix').onclick=closePix;document.getElementById('donePix').onclick=closePix;document.getElementById('copyPix').onclick=()=>copyValue(document.getElementById('copyPix').dataset.value,document.getElementById('copyPix'),document.getElementById('pixStatus'));nameInput.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();confirmGift()}});window.addEventListener('message',event=>{if(event.data?.type==='mforge:gift-list:copy-pix-result'){const button=document.getElementById('copyPix');if(button)button.textContent=event.data.ok?'✓ Pix copiado':'Copiar chave Pix';const status=document.getElementById('pixStatus');if(status)status.textContent=event.data.ok?'Chave Pix copiada para a área de transferência.':'Selecione a chave Pix e copie manualmente.'}});load().catch(error=>{app.className='gift-status';app.textContent=error.message});
</script></body></html>
